name: Keep Render Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render service
        run: |
          status=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "https://thetanonbot.onrender.com/")
          echo "HTTP status: $status"
          if [ "$status" -eq 0 ] || [ "$status" -ge 500 ]; then
            echo "Service unreachable or returned 5xx ($status)"
            exit 1
          fi
